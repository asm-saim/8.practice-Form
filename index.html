<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/form.css">
    <title>Kung Fi Form</title>
</head>

<body>
    <header></header>
    <main>
        <form action="">
            <section class="f-first">
                <label for="srch">Search Your Image here:</label>
                <input type="search" name="" id="srch">
                <button type="submit">Search</button>

            </section>

            <section class="f-second">
                <img src="media/panda.jpg" alt="">
                <br>
                <a href="https://www.magnific.com/free-photos-vectors/kung-fu">For more info, Click here!</a>
            </section>
            <section>
                <h3>Feedback Form:</h3>
                <label for="nm">Name</label>
                <input type="text" name="" id="nm" placeholder="Your name" required>
                <br>
                <br>
                <label for="dt">Date</label>
                <input type="date" name="" id="dt">
                <br>
                <br>
                <section>
                    <select name="Region" id="Region">
                        <option value="" disabled selected>Select Region</option>
                        <option value="us">USA</option>
                        <option value="uk">UK</option>
                        <option value="uae">UAE</option>
                        <option value="aus">AUS</option>
                    </select>
                </section>
                <br>
                <br>
                <label for="cmt">Comment</label>
                <br>
                <textarea name="" rows="5" cols="50" id="cmt"></textarea>
                <br>
                <input type="submit" value="submit">

            </section>



        </form>
    </main>
    <footer></footer>
</body>

</html>
